name: Stock Monitor

# 가상화폐 시세 감시 → 휴대폰(ntfy) 알림. 실제 주문 없음.
# PC 원본: D:\AI 프로그램\자동화 프로그램\가상화폐 모의투자 ('stock cloud push' 로 올림)
on:
  schedule:
    - cron: '3-59/5 * * * *'   # 5분마다(정각은 붐벼서 3분부터). GitHub 사정으로 더 늦게 돌 때가 있다
  workflow_dispatch:

concurrency:
  group: stock-monitor
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: 이전 상태 불러오기
        uses: actions/cache/restore@v4
        with:
          path: state.json
          key: stock-state-${{ github.run_id }}
          restore-keys: stock-state-

      - name: 감시
        run: python3 cloud_monitor.py
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}

      - name: 상태 저장
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state.json
          key: stock-state-${{ github.run_id }}
