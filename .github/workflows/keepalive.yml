name: Keepalive

# 공개 저장소는 60일 동안 활동이 없으면 예약 실행이 자동으로 꺼진다. 한 달에 한 번 기록을 남긴다.
on:
  schedule:
    - cron: '17 1 1 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          date -u +%Y-%m-%dT%H:%M:%SZ > .keepalive
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add .keepalive
          git commit -m "keepalive" && git push
